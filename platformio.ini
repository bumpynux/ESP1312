; ESP1312: M5Stack Cardputer ADV (ESP32-S3) geotagged WiFi + BLE surveillance logger.
;
; Board wiring (defaults in src/main.cpp, override with -D build flags):
;   SD  : SCK=40 MISO=39 MOSI=14 CS=12   HSPI, GPIO5 high to enable the card
;   GPS : probed. RX=15 TX=13 (LoRa-1262 Cap) first, then the Grove port pins 1 and 2 either way round
[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTZ_HOURS=0                                ; local offset (hours from UTC) for the date in file names; set to yours

lib_deps =
    m5stack/M5Cardputer@^1.1.1
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.2.0

board_build.partitions = default_8MB.csv
board_build.flash_mode = dio   ; the ADV's flash needs DIO, QIO bootloops (TG0WDT)
